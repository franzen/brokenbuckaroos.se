version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Quarantine new releases before Dependabot proposes them (version updates only;
    # security updates are never delayed by cooldown)
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 30
    # Bundle minor/patch bumps into one PR (one lockfile change, one deploy).
    # Majors are left ungrouped so each gets its own PR and review.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
